services:
  mediaclipmakarr:
    build:
      context: .
    ports:
      - "${MCM_COMPOSE_PORT:-3623}:8000"
    environment:
      MCM_PRIVATE_DATA_DIR: "${MCM_PRIVATE_DATA_DIR:-/data/private}"
      MCM_WORK_DIR: "${MCM_WORK_DIR:-/data/work}"
      MCM_CLIP_DIR: "${MCM_CLIP_DIR:-/data/clips}"
      MCM_SOURCE_DIRS: '${MCM_SOURCE_DIRS:-["/media"]}'
      MCM_FFMPEG_PATH: "${MCM_FFMPEG_PATH:-/opt/jellyfin-ffmpeg/ffmpeg}"
      MCM_FFPROBE_PATH: "${MCM_FFPROBE_PATH:-/opt/jellyfin-ffmpeg/ffprobe}"
      MCM_EXPECTED_FFMPEG_IDENTITY: "${MCM_EXPECTED_FFMPEG_IDENTITY:-7.1.4-Jellyfin}"
      MCM_BLOCKING_IO_WORKERS: "${MCM_BLOCKING_IO_WORKERS:-4}"
      MCM_PLEX_URL: "${MCM_PLEX_URL:-}"
      MCM_PLEX_TOKEN: "${MCM_PLEX_TOKEN:-}"
      MCM_SOURCE_PATH_MAPPINGS: '${MCM_SOURCE_PATH_MAPPINGS:-}'
      MCM_TIMEZONE: "${MCM_TIMEZONE:-}"
      MCM_X264_PRESET: "${MCM_X264_PRESET:-}"
      MCM_ALEMBIC_INI_PATH: "${MCM_ALEMBIC_INI_PATH:-/app/alembic.ini}"
      MCM_ALEMBIC_SCRIPT_DIR: "${MCM_ALEMBIC_SCRIPT_DIR:-/app/alembic}"
      MCM_DEV_API_PORT: "${MCM_DEV_API_PORT:-8000}"
      MCM_DEV_WEB_PORT: "${MCM_DEV_WEB_PORT:-5173}"
    volumes:
      - "private-data:${MCM_PRIVATE_DATA_DIR:-/data/private}"
      - "work-data:${MCM_WORK_DIR:-/data/work}"
      - "clip-library:${MCM_CLIP_DIR:-/data/clips}"
      - "${MCM_COMPOSE_SOURCE_DIR:-./data/sources}:/media:ro"
    restart: unless-stopped

volumes:
  private-data:
  work-data:
  clip-library:
